# This file grants necessary permissions to workflows
# Place in: .github/workflows/permissions.yml

# Grant write permission to the GITHUB_TOKEN
permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

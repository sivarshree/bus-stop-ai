name: Daily AI Retraining
on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:      # Allows manual run

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        # Use PAT token for checkout with write permissions
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        # Install from requirements.txt if it exists
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          # Fallback if requirements.txt missing
          pip install fastapi==0.104.1 uvicorn[standard]==0.24.0 tensorflow==2.15.0 numpy==1.24.3 pandas==2.1.4 pymongo==4.5.0 joblib==1.3.2 scikit-learn==1.3.2
        fi
    
    - name: Train with real MongoDB data
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        echo "🔄 Starting training..."
        echo "========================================"
        python train_real_data.py
        echo "========================================"
        echo "✅ Training completed!"
    
    - name: Check for model updates
      id: check-updates
      run: |
        # Check if model files were modified
        echo "🔍 Checking for model updates..."
        if git status --porcelain | grep -E '(bus_stop_predictor\.h5|scaler\.pkl|model_info\.json)'; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "📤 Model files were updated - will commit"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "📭 No changes to model files"
        fi
    
    - name: Commit and push updated model
      if: steps.check-updates.outputs.changes == 'true'
      env:
        # Use PAT token for authentication
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        echo "📝 Committing updated model files..."
        
        # Configure git
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Set remote URL with PAT token
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        
        # Add only model files
        git add bus_stop_predictor.h5 scaler.pkl model_info.json
        
        # Commit
        git commit -m "🤖 Daily AI model update - $(date +'%Y-%m-%d')
        
        📊 Training Summary:
        - Records used: $(grep -o '"records_used":[0-9]*' model_info.json | cut -d: -f2)
        - Sequences: $(grep -o '"sequences_created":[0-9]*' model_info.json | cut -d: -f2)
        - Test MAE: $(grep -o '"test_mae":[0-9]*\.?[0-9]*' model_info.json | cut -d: -f2)"
        
        # Push to main branch
        echo "🚀 Pushing to GitHub..."
        git push origin HEAD:main
        
        echo "✅ Successfully updated repository!"
    
    - name: Upload trained models as artifact
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: |
          bus_stop_predictor.h5
          scaler.pkl
          model_info.json
        retention-days: 7
    
    - name: Training Summary
      run: |
        echo "========================================"
        echo "🎯 DAILY TRAINING COMPLETE"
        echo "========================================"
        
        if [ -f model_info.json ]; then
          echo "📊 Training Results:"
          python -c "
import json
try:
    with open('model_info.json', 'r') as f:
        data = json.load(f)
    print(f'  • Records used: {data.get(\"records_used\", 0)}')
    print(f'  • Sequences created: {data.get(\"sequences_created\", 0)}')
    print(f'  • Test MAE: {data.get(\"test_mae\", 0):.4f}')
    print(f'  • Last trained: {data.get(\"last_trained\", \"Unknown\")}')
    print(f'  • Status: {data.get(\"status\", \"Unknown\")}')
except:
    print('  • Could not read model_info.json')
          "
        else:
          echo "  • model_info.json not found"
        
        echo ""
        echo "📥 Download updated models from Artifacts section"
        echo "🔄 Next training: Tomorrow at 2 AM UTC"
        echo "========================================"

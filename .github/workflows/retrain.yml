name: Daily AI Retraining
on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:      # Allows manual run

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        # Install from requirements.txt if it exists
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          # Fallback if requirements.txt missing
          pip install fastapi==0.104.1 uvicorn[standard]==0.24.0 tensorflow==2.15.0 numpy==1.24.3 pandas==2.1.4 pymongo==4.5.0 joblib==1.3.2 scikit-learn==1.3.2
        fi
    
    - name: Train with real MongoDB data
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        echo "🔄 Starting training..."
        python train_real_data.py
    
    - name: Check for model updates
      id: check-updates
      run: |
        # Check if any model files changed
        git status --porcelain | grep -E '(bus_stop_predictor\.h5|scaler\.pkl|model_info\.json)' && echo "changes=true" >> $GITHUB_OUTPUT || echo "changes=false" >> $GITHUB_OUTPUT
    
     - name: Commit updated model
      if: steps.check-updates.outputs.changes == 'true'
      env:
        # Use PAT token instead of GITHUB_TOKEN
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        git add bus_stop_predictor.h5 scaler.pkl model_info.json
        git commit -m "🤖 Daily AI model update - $(date +'%Y-%m-%d')"
        git push origin main

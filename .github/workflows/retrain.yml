name: Daily AI Retraining

on:
  schedule:
    - cron: '0 19 * * *'  # 7 PM UTC = 3 AM Malaysia Time
  workflow_dispatch:      # Manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train with real MongoDB data
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        echo "🔄 Starting training..."
        python train_real_data.py
        echo "✅ Training completed!"
    
    - name: Check for model updates
      id: check-updates
      run: |
        echo "🔍 Checking for model updates..."
        # Check if any model files were modified
        if git status --porcelain | grep -q -E '(bus_stop_predictor\.h5|scaler\.pkl|model_info\.json)'; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "📤 Model files were updated"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "📭 No changes to model files"
        fi
    
    - name: Commit and push updated model
      if: steps.check-updates.outputs.changes == 'true'
      run: |
        echo "📝 Committing updated model files..."
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add bus_stop_predictor.h5 scaler.pkl model_info.json
        git commit -m "🤖 Daily AI model update - $(date +'%Y-%m-%d')"
        git push
    
    - name: Upload trained models as artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: |
          bus_stop_predictor.h5
          scaler.pkl
          model_info.json
